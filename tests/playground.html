<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Rush — interaction test bench</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../microgames.css"><link rel="stylesheet" href="../extra-games.css"><link rel="stylesheet" href="../butterfly.css"><link rel="stylesheet" href="../theme.css"><style>
body{padding:20px}h1{font-size:20px;letter-spacing:0;line-height:1.3}p{font-size:12px}.test-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0}.test-controls button,.test-controls select{padding:7px;border:1px solid #ccd3c1;border-radius:6px;background:#fffaf0}.test-board{position:relative;min-height:350px;max-width:1100px;padding:12px;border:1px solid #d8dece}.test-gallery{display:grid;grid-template-columns:repeat(auto-fit,var(--test-size,174px));gap:10px}.test-gallery .tile{width:var(--test-size,174px)}.test-status{font-size:10px;margin-left:4px;color:#426d39}.tile.test-done{box-shadow:inset 0 0 0 2px #6e9565}.test-single{max-width:380px;min-height:410px}
</style></head><body><h1>Micro-game interaction test bench</h1><p>Isolated controls without run deadlines. Hatch, memory, holding and animations still use the game clock.</p><div class="test-controls"><label>Game <select id="test-game" aria-label="Game"><option value="all">All 23 games</option><option value="updated">Updated games</option></select></label><button id="reset">Reset games</button><button id="compact">128 px tiles</button><button id="phone">174 px tiles</button><button id="large">211 px tiles</button><button id="foil">Toggle Holofoil</button><button id="pause">Pause bench</button><a href="../">Return to game</a></div><div id="test-board" class="test-board"><div id="test-gallery" class="test-gallery"></div></div><p id="result" aria-live="polite">Ready</p><script src="../engine.js"></script><script src="../microgames.js"></script><script src="../extra-games.js"></script><script src="../butterfly.js"></script><script src="../theme.js"></script><script>
const select=document.getElementById('test-game'), gallery=document.getElementById('test-gallery'), board=document.getElementById('test-board'), result=document.getElementById('result');
const habitat=new LittleRushButterfly.Habitat(board);let views=[], elapsed=0,last=performance.now(),paused=false;
LittleRushGames.catalog.forEach(game=>{const option=document.createElement('option');option.value=game.id;option.textContent=game.title;select.append(option);});
function reset(){views.forEach(view=>view.destroy());views=[];gallery.innerHTML='';habitat.reset();elapsed=0;last=performance.now();paused=false;document.getElementById('pause').textContent='Pause bench';gallery.inert=false;board.classList.toggle('test-single',!['all','updated'].includes(select.value));const games=LittleRushGames.catalog.filter(game=>select.value==='all'||select.value===game.id||(select.value==='updated'&&['simon','shapes','catch','stop','match','maze','aim','feed'].includes(game.id)));games.forEach(game=>{const tile=document.createElement('section');tile.className='tile '+game.color;tile.dataset.game=game.id;tile.innerHTML='<header class="tile-header"><span class="tile-title">'+game.title+'</span><span class="test-status"></span></header><div class="microgame"></div>';gallery.append(tile);views.push(LittleRushGames.mount(tile.querySelector('.microgame'),game.id,{butterfly:habitat,onComplete:()=>{tile.classList.add('test-done');tile.querySelector('.test-status').textContent='✓';result.textContent=game.title+' completed';}}));});if(select.value==='feed')habitat.hatch(0,0);result.textContent=games.length+' games ready';}
document.getElementById('foil').onclick=()=>LittleRushTheme.setTheme(LittleRushTheme.getTheme()==='flat'?'holofoil':'flat');document.getElementById('reset').onclick=reset;select.onchange=reset;document.getElementById('compact').onclick=()=>gallery.style.setProperty('--test-size','128px');document.getElementById('phone').onclick=()=>gallery.style.setProperty('--test-size','174px');document.getElementById('large').onclick=()=>gallery.style.setProperty('--test-size','211px');document.getElementById('pause').onclick=()=>{paused=!paused;if(paused)views.forEach(view=>view.suspend?.());gallery.inert=paused;document.getElementById('pause').textContent=paused?'Resume bench':'Pause bench';habitat.update(elapsed,!paused);};
function frame(now){const delta=Math.min(now-last,100);last=now;if(!paused){elapsed+=delta;views.forEach(view=>view.tick(elapsed,delta));}habitat.update(elapsed,!paused);requestAnimationFrame(frame);}reset();requestAnimationFrame(frame);
</script></body></html>
